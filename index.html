<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 推币机</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD overlay -->
  <div id="hud">
    <div id="stats-bar">
      <div class="stat">
        <span class="stat-label">🪙 持有</span>
        <span class="stat-val" id="ui-coins">30</span>
      </div>
      <div class="stat jackpot-stat">
        <span class="stat-label">🎰 Jackpot</span>
        <div id="jackpot-bar"><div id="jackpot-fill"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">⭐ 得分</span>
        <span class="stat-val" id="ui-score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">🏆 最高</span>
        <span class="stat-val" id="ui-hiscore">0</span>
      </div>
    </div>

    <div id="drop-guide">← 点击画面投币 →</div>

    <div id="controls-bar">
      <button class="btn btn-gold" id="btn-drop">🪙 投币</button>
      <button class="btn btn-blue" id="btn-auto">🤖 自动</button>
      <button class="btn btn-red" id="btn-reset">🔄 重置</button>
    </div>
  </div>

  <!-- Drop indicator (follows mouse on canvas) -->
  <div id="drop-indicator"></div>

  <!-- Floating messages -->
  <div id="game-message"></div>

  <script type="module" src="game.js"></script>
</body>
</html>
