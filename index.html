<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>推币机游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header>
      <h1>🪙 推币机</h1>
      <div id="stats">
        <div class="stat">
          <span class="label">持有硬币</span>
          <span id="coins-held" class="value">20</span>
        </div>
        <div class="stat">
          <span class="label">得分</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">最高分</span>
          <span id="high-score" class="value">0</span>
        </div>
      </div>
    </header>

    <div id="game-area">
      <canvas id="game-canvas"></canvas>
      <div id="drop-zone">
        <div id="drop-indicator"></div>
        <div id="drop-hint">点击投币</div>
      </div>
    </div>

    <div id="controls">
      <button id="btn-insert" class="btn btn-primary">
        🪙 投入硬币
      </button>
      <button id="btn-auto" class="btn btn-secondary">
        自动投币
      </button>
      <button id="btn-reset" class="btn btn-danger">
        重置游戏
      </button>
    </div>

    <div id="message-overlay" class="hidden">
      <div id="message-box">
        <div id="message-icon"></div>
        <div id="message-text"></div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
